<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Бордо 2026</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
  :root {
    --bordo: #570f23;
    --bordo-2: #7a1832;
    --rose: #ab5d73;
    --peach: #fed4ac;

    --bg: #f2eeee;
    --bg-tint: radial-gradient(120% 60% at 100% 0%, #f6dfe3 0%, rgba(246,223,227,0) 60%),
               radial-gradient(90% 50% at 0% 40%, #fbe9da 0%, rgba(251,233,218,0) 60%), #f4f0f0;
    --label: #1c1c1e;
    --label-2: rgba(60,60,67,.62);
    --label-3: rgba(60,60,67,.36);
    --sep: rgba(60,60,67,.14);
    --glass: rgba(255,255,255,.58);
    --glass-strong: rgba(255,255,255,.74);
    --glass-edge: rgba(255,255,255,.85);
    --glass-shadow: 0 8px 32px rgba(87,15,35,.10), 0 1px 2px rgba(0,0,0,.04);
    --fill: rgba(120,120,128,.12);
    --accent: #8f2343;
  }
  :root[data-theme="dark"] {
    --bg: #0c0709;
    --bg-tint: radial-gradient(120% 60% at 100% 0%, #3a0f1d 0%, rgba(58,15,29,0) 60%),
               radial-gradient(90% 50% at 0% 45%, #2a1410 0%, rgba(42,20,16,0) 60%), #0c0709;
    --label: #f5f5f7;
    --label-2: rgba(235,235,245,.62);
    --label-3: rgba(235,235,245,.32);
    --sep: rgba(255,255,255,.10);
    --glass: rgba(40,28,32,.52);
    --glass-strong: rgba(48,34,38,.72);
    --glass-edge: rgba(255,255,255,.14);
    --glass-shadow: 0 8px 32px rgba(0,0,0,.45);
    --fill: rgba(120,120,128,.24);
    --accent: #e7a0b3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    min-height: 100vh; background: var(--bg-tint); background-attachment: fixed;
    font: 400 16px/1.42 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    color: var(--label); letter-spacing: -.01em;
    padding-bottom: calc(120px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  a { color: inherit; }

  /* ---------- Liquid Glass ---------- */
  .glass {
    position: relative; background: var(--glass);
    -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
    border-radius: 26px; box-shadow: var(--glass-shadow);
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1px; z-index: 2;
    background: linear-gradient(160deg, var(--glass-edge), rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, var(--glass-edge));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }

  /* ---------- views ---------- */
  .view { display: none; padding: 0 16px; }
  .view.on { display: block; }
  .view.from-right { animation: from-right .5s cubic-bezier(.22,1,.36,1); }
  .view.from-left { animation: from-left .5s cubic-bezier(.22,1,.36,1); }
  .view.from-below { animation: from-below .55s cubic-bezier(.22,1,.36,1); }
  .view.fade { animation: fade .45s ease; }
  @keyframes from-right { from { opacity: 0; transform: translateX(28px); } }
  @keyframes from-left { from { opacity: 0; transform: translateX(-28px); } }
  @keyframes from-below { from { opacity: 0; transform: translateY(40px) scale(.97); } }
  @keyframes fade { from { opacity: 0; } }

  .large-title { font: 800 34px/1.1 -apple-system, "SF Pro Display", system-ui, sans-serif; letter-spacing: -.025em; padding: 20px 4px 4px; }
  .caption { color: var(--label-2); font-size: 15px; padding: 0 4px 16px; }
  .section-h { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; color: var(--label-2); padding: 22px 18px 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .section-h small { text-transform: none; letter-spacing: 0; font-weight: 500; }

  /* ---------- hero ---------- */
  .hero { margin: 12px 0 0; border-radius: 34px; overflow: hidden; position: relative; color: #fff; min-height: 520px;
    background: var(--bordo); box-shadow: 0 20px 50px rgba(87,15,35,.35); isolation: isolate; }
  .hero-bg { position: absolute; inset: -20px; z-index: -2; background: url("https://static.tildacdn.com/tild3065-6165-4533-b363-333665343236/_.png") center/cover;
    animation: kenburns 22s ease-in-out infinite alternate; will-change: transform; }
  @keyframes kenburns { from { transform: scale(1.12) translate3d(-2%, 0, 0); } to { transform: scale(1.02) translate3d(2%, -1%, 0); } }
  .hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(87,15,35,.1) 0%, rgba(87,15,35,.05) 35%, rgba(40,6,16,.94) 100%); }
  .hero-face { position: absolute; right: -70px; bottom: 80px; width: 300px; z-index: -1; animation: face-in 1.4s cubic-bezier(.22,1,.36,1) both, float 7s ease-in-out 1.4s infinite; }
  @keyframes face-in { from { opacity: 0; transform: translateY(30px) scale(.96); filter: blur(8px); } }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .hero-in { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 16px; }
  .hero-top { display: flex; justify-content: space-between; align-items: center; }
  .chip-glass, .lang { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 100px;
    background: rgba(255,255,255,.18); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.45), inset 0 1px 0 rgba(255,255,255,.35); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--peach); box-shadow: 0 0 8px var(--peach); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .lang { padding: 3px; gap: 0; position: relative; }
  .lang button { position: relative; z-index: 1; padding: 4px 10px; border-radius: 100px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.75); transition: color .3s; }
  .lang button.on { color: var(--bordo); }
  .lang i { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 100px; background: #fff; transition: transform .5s cubic-bezier(.34,1.45,.64,1); }
  .lang[data-l="en"] i { transform: translateX(100%); }
  .hero-bottom { margin-top: auto; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .hero h1 { font: 900 clamp(22px, 7.3vw, 32px)/1.04 'Raleway', sans-serif; hyphens: auto; text-transform: uppercase; margin: 6px 0 8px; letter-spacing: -.01em; }
  .hero .sub { font-size: 15px; opacity: .85; }
  .hero-meta { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; border-radius: 22px; overflow: hidden;
    background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.4), inset 0 1px 0 rgba(255,255,255,.3); }
  .hero-meta div { padding: 11px 12px; }
  .hero-meta div + div { border-left: .5px solid rgba(255,255,255,.25); }
  .hero-meta small { display: block; font-size: 10.5px; opacity: .7; text-transform: uppercase; letter-spacing: .05em; }
  .hero-meta b { font-size: 14px; font-weight: 700; line-height: 1.2; display: block; }
  .rise { animation: rise .9s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(var(--i, 0) * 90ms + 150ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } }

  /* ---------- buttons ---------- */
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 54px; border-radius: 100px;
    font-size: 17px; font-weight: 600; letter-spacing: -.01em; text-decoration: none; transition: transform .25s cubic-bezier(.34,1.56,.64,1), filter .15s; }
  .btn:active { transform: scale(.96); filter: brightness(.95); }
  .btn-peach { background: var(--peach); color: var(--bordo); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 6px 20px rgba(254,212,172,.35); position: relative; overflow: hidden; }
  .btn-peach::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; transform: skewX(-20deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.6), rgba(255,255,255,0)); animation: shine 4.5s ease-in-out 2s infinite; }
  @keyframes shine { 0%, 70% { left: -60%; } 100% { left: 130%; } }
  .btn-accent { background: linear-gradient(180deg, var(--bordo-2), var(--bordo)); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 8px 24px rgba(87,15,35,.35); }
  .btn-glass { background: var(--glass-strong); color: var(--accent); box-shadow: var(--glass-shadow), inset 0 0 0 .5px var(--glass-edge); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .hero .btn { margin-top: 12px; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .btn-row .btn { height: 48px; font-size: 15px; }

  /* ---------- grouped lists ---------- */
  .group { overflow: hidden; }
  .row { display: flex; align-items: center; gap: 14px; padding: 13px 16px; min-height: 52px; position: relative; text-decoration: none; color: inherit; width: 100%; text-align: left; }
  .row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 62px; border-top: .5px solid var(--sep); }
  .row.plain + .row.plain::before { left: 16px; }
  .ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; flex: 0 0 auto; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-weight: 600; font-size: 16px; }
  .row .t span { display: block; color: var(--label-2); font-size: 14px; line-height: 1.35; }
  .chev { color: var(--label-3); font-size: 20px; font-weight: 500; }
  .tag { font-size: 13px; color: var(--label-2); }
  .check { color: #34c759; font-weight: 700; font-size: 17px; width: 22px; text-align: center; }
  .note { font-size: 13px; color: var(--label-2); padding: 8px 18px 0; }

  .card { padding: 18px; }
  .card p { color: var(--label-2); font-size: 15px; }
  .card p + p { margin-top: 8px; }
  .card h3 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; }

  /* ---------- countdown ---------- */
  .cd { padding: 18px; overflow: hidden; }
  .cd-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: .03em; }
  .cd-digits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 14px; }
  .cd-digits div { text-align: center; background: var(--fill); border-radius: 16px; padding: 10px 0 8px; }
  .cd-digits b { display: block; font-size: 28px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--accent); }
  .cd-digits small { font-size: 11px; color: var(--label-2); }
  .cd-past { display: flex; gap: 14px; align-items: center; margin: 12px 0 14px; }
  .cd-past .badge { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; background: var(--fill); flex: 0 0 auto; }
  .cd-past b { display: block; font-size: 17px; }
  .cd-past span { color: var(--label-2); font-size: 14px; }
  .seats-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .seats-top b { color: var(--accent); }
  .seats-bar { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 4px; }
  .seats-bar i { height: 8px; border-radius: 4px; background: var(--fill); transform: scaleY(.4); transition: background .4s, transform .5s cubic-bezier(.34,1.56,.64,1); transition-delay: calc(var(--k) * 45ms); }
  .seats-bar.in i { transform: none; }
  .seats-bar.in i.taken { background: linear-gradient(90deg, var(--bordo-2), var(--rose)); }

  /* ---------- stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { padding: 14px 10px; text-align: center; }
  .stat b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -.03em; color: var(--accent); }
  .stat span { font-size: 12px; color: var(--label-2); line-height: 1.2; display: block; }

  /* ---------- gallery & reviews ---------- */
  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .shot { position: relative; overflow: hidden; border-radius: 24px; box-shadow: var(--glass-shadow); background: var(--fill); }
  .shot.tall { aspect-ratio: 2 / 3; }
  .shot.wide { grid-column: span 2; aspect-ratio: 16 / 9; }
  .shot img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .shot .zoom { position: absolute; right: 10px; bottom: 10px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 14px;
    background: rgba(0,0,0,.25); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.4); }
  .reviews { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 4px 16px 10px; scrollbar-width: none; }
  .reviews::-webkit-scrollbar { display: none; }
  .reviews .shot { flex: 0 0 44%; aspect-ratio: 9 / 16; scroll-snap-align: start; border-radius: 22px; }
  .reviews .shot img { object-position: top; }

  .topic-num { font: 800 15px/1 -apple-system, system-ui, sans-serif; color: var(--accent); background: var(--fill); width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: 0 0 auto; }
  .teacher { display: flex; gap: 14px; padding: 12px; align-items: center; }
  .teacher + .teacher { margin-top: 10px; }
  .teacher img { width: 92px; height: 112px; object-fit: cover; border-radius: 20px; flex: 0 0 auto; }
  .teacher b { font-size: 17px; font-weight: 700; display: block; letter-spacing: -.02em; }
  .teacher i { font-style: normal; font-size: 13px; color: var(--accent); display: block; margin: 1px 0 4px; font-weight: 600; }
  .teacher p { font-size: 13px; color: var(--label-2); line-height: 1.35; }

  /* ---------- other events ---------- */
  .events { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px 10px; scrollbar-width: none; scroll-snap-type: x mandatory; }
  .events::-webkit-scrollbar { display: none; }
  .event { flex: 0 0 62%; padding: 16px; scroll-snap-align: start; text-align: left; display: flex; flex-direction: column; gap: 6px; min-height: 150px; }
  .event .flag { font-size: 26px; }
  .event b { font-size: 17px; letter-spacing: -.02em; }
  .event span { font-size: 13px; color: var(--label-2); }
  .event em { margin-top: auto; font-style: normal; font-size: 12px; font-weight: 700; color: var(--accent); }

  /* ---------- program ---------- */
  .seg { display: flex; padding: 3px; border-radius: 100px; gap: 2px; margin-bottom: 12px; }
  .seg button { flex: 1; height: 34px; border-radius: 100px; font-size: 14px; font-weight: 600; color: var(--label-2); transition: color .3s; position: relative; z-index: 1; }
  .seg button.on { color: var(--label); }
  .seg-ind, .tab-ind { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 100px; pointer-events: none;
    transition: transform .55s cubic-bezier(.34,1.45,.64,1), width .55s cubic-bezier(.34,1.45,.64,1), opacity .3s; }
  .seg-ind { background: var(--glass-strong); box-shadow: 0 2px 10px rgba(0,0,0,.08), inset 0 0 0 .5px var(--glass-edge); }
  .daycard { display: flex; gap: 14px; padding: 14px 16px; }
  .daycard + .daycard { margin-top: 10px; }
  .daycard.hide { display: none; }
  .daycard.pop { animation: pop .45s cubic-bezier(.34,1.45,.64,1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(8px); } }
  .cal { width: 52px; flex: 0 0 auto; border-radius: 14px; overflow: hidden; text-align: center; background: var(--glass-strong); box-shadow: inset 0 0 0 .5px var(--sep); align-self: flex-start; }
  .cal small { display: block; background: var(--bordo); color: #fff; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 0; letter-spacing: .05em; }
  .cal b { display: block; font-size: 22px; font-weight: 700; padding: 3px 0 4px; letter-spacing: -.02em; }
  .daycard .t b { font-weight: 600; display: block; }
  .daycard .t span { color: var(--label-2); font-size: 14px; display: block; }
  .pill-tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--fill); border-radius: 100px; padding: 2px 8px; margin-top: 4px; }

  .price-hero { border-radius: 30px; padding: 22px; color: #fff; position: relative; overflow: hidden;
    background: radial-gradient(120% 120% at 100% 0%, #b4657c 0%, var(--bordo) 55%, #3a0716 100%); box-shadow: 0 18px 44px rgba(87,15,35,.35); }
  .price-hero::after { content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%; right: -70px; top: -90px;
    background: radial-gradient(circle, rgba(254,212,172,.5), rgba(254,212,172,0) 70%); animation: glow 6s ease-in-out infinite alternate; }
  @keyframes glow { to { transform: translate(-30px, 20px) scale(1.2); } }
  .price-hero small { font-size: 13px; opacity: .75; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .price-hero .sum { font-size: 56px; font-weight: 800; letter-spacing: -.04em; line-height: 1; margin: 4px 0 2px; }
  .price-hero .per { opacity: .75; font-size: 14px; }
  .banner { display: flex; gap: 10px; align-items: center; padding: 12px 16px; margin-top: 12px; font-size: 14px; }

  /* ---------- trip / map ---------- */
  .map-wrap { height: 300px; overflow: hidden; padding: 0; }
  #map { position: absolute; inset: 0; border-radius: inherit; z-index: 0; background: var(--fill); }
  .leaflet-container { font: inherit; }
  .leaflet-control-attribution { font-size: 9px; background: rgba(255,255,255,.6) !important; border-radius: 8px 0 0 0; }
  .leaflet-control-zoom { display: none; }
  .tiles-light { filter: saturate(.75) sepia(.12) brightness(1.03); }
  .tiles-dark { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6); }
  .pin { width: 34px; height: 34px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); display: grid; place-items: center;
    background: linear-gradient(180deg, var(--bordo-2), var(--bordo)); box-shadow: 0 6px 16px rgba(87,15,35,.45), inset 0 0 0 2px rgba(255,255,255,.85); }
  .pin span { transform: rotate(45deg); font-size: 15px; }
  .pin.on { animation: bounce .7s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bounce { 40% { transform: rotate(-45deg) translate(6px, -6px) scale(1.15); } }
  .leaflet-popup-content-wrapper { border-radius: 16px; background: var(--glass-strong); color: var(--label); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: var(--glass-shadow); }
  .leaflet-popup-tip { background: var(--glass-strong); }
  .leaflet-popup-content { margin: 10px 14px; font-size: 14px; }
  .place.active { background: var(--fill); }
  .memo h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--accent); padding: 14px 16px 4px; }

  /* ---------- faq ---------- */
  .qa { position: relative; }
  .qa + .qa::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; border-top: .5px solid var(--sep); }
  .qa-q { width: 100%; text-align: left; padding: 15px 48px 15px 16px; font-weight: 600; font-size: 16px; position: relative; }
  .qa-q::after { content: ""; position: absolute; right: 20px; top: 50%; width: 8px; height: 8px; border-right: 2px solid var(--label-3); border-bottom: 2px solid var(--label-3);
    transform: translateY(-70%) rotate(45deg); transition: transform .45s cubic-bezier(.34,1.56,.64,1); }
  .qa.open .qa-q::after { transform: translateY(-20%) rotate(-135deg); }
  .qa-a { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s cubic-bezier(.22,1,.36,1); }
  .qa.open .qa-a { grid-template-rows: 1fr; }
  .qa-a > div { overflow: hidden; }
  .qa-a p { padding: 0 16px 15px; color: var(--label-2); font-size: 15px; opacity: 0; transform: translateY(-6px); transition: opacity .3s, transform .45s cubic-bezier(.22,1,.36,1); }
  .qa.open .qa-a p { opacity: 1; transform: none; transition-delay: .08s; }
  .ask { display: flex; gap: 14px; align-items: center; padding: 16px; margin-top: 14px; }
  .ask .big { font-size: 30px; }
  .ask b { display: block; font-size: 16px; }
  .ask span { font-size: 14px; color: var(--label-2); }

  /* ---------- form ---------- */
  .field { display: flex; align-items: center; padding: 0 16px; min-height: 52px; position: relative; }
  .field + .field::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; border-top: .5px solid var(--sep); }
  .field label { width: 120px; flex: 0 0 auto; font-size: 16px; }

function renderCountdown() {
  const el = document.getElementById("cd");
  const now = Date.now(), start = Date.parse(CONFIG.courseStart), end = Date.parse(CONFIG.courseEnd);
  const taken = CONFIG.seatsTotal - CONFIG.seatsLeft;
  const [seatsL, seatsR] = L.seats(CONFIG.seatsLeft, CONFIG.seatsTotal);
  const bar = `<div class="seats-top"><span>${seatsL}</span><b>${seatsR}</b></div>
    <div class="seats-bar" style="--n:${CONFIG.seatsTotal}">${Array.from({ length: CONFIG.seatsTotal }, (_, k) => `<i style="--k:${k}" class="${k < taken ? "taken" : ""}"></i>`).join("")}</div>`;
  let body;
  if (now < start) {
    body = `<div class="cd-head">${L.cdTitle}</div><div class="cd-digits">${L.cdUnits.map((u, i) => `<div><b data-u="${i}">0</b><small>${u}</small></div>`).join("")}</div>`;
  } else {
    const [e, b, s] = now <= end ? L.cdLive : L.cdPast;
    body = `<div class="cd-past"><span class="badge">${e}</span><div><b>${b}</b><span>${s}</span></div></div>`;
  }
  el.innerHTML = body + bar;
  tick();
}
function tick() {
  const cells = document.querySelectorAll("#cd [data-u]");
  if (!cells.length) return;
  let s = Math.max(0, Math.floor((Date.parse(CONFIG.courseStart) - Date.now()) / 1000));
  const v = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
  cells.forEach((c, i) => { const t = String(v[i]).padStart(i ? 2 : 1, "0"); if (c.textContent !== t) c.textContent = t; });
}
setInterval(tick, 1000);

const REVEAL = ".section-h, .stat, .gallery .shot, .card, .group, .teacher, .daycard, .price-hero, .banner, .large-title, .caption, .seg, .note, .cd, .map-wrap, .ask, .btn-row, #form > *";
const io = new IntersectionObserver(entries => {
  let n = 0;
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.style.setProperty("--d", (n++ * 70) + "ms");
    e.target.classList.add("in");
    io.unobserve(e.target);
    const c = e.target.querySelector("[data-count]");
    if (c) countUp(c);
    const sb = e.target.querySelector(".seats-bar");
    if (sb) setTimeout(() => sb.classList.add("in"), 250);
  });
}, { rootMargin: "0px 0px -8% 0px" });
function armReveal(view) {
  if (!view) return;
  view.querySelectorAll(REVEAL).forEach(el => { el.classList.add("reveal"); el.classList.remove("in"); io.observe(el); });
  view.querySelectorAll(".seats-bar").forEach(b => b.classList.remove("in"));
}
function countUp(el) {
  const end = +el.dataset.count, suf = el.dataset.suffix || "", t0 = performance.now(), dur = 1100;
  const step = t => { const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))) + suf; if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// ================= НАВИГАЦИЯ =================
const tabInd = document.getElementById("tab-ind");
const ORDER = ["home", "program", "trip", "faq", "apply"];
let current = "home";
function moveIndicator(ind, target, squish) {
  if (!ind || !target) return;
  ind.style.width = target.offsetWidth + "px";
  ind.style.transform = `translateX(${target.offsetLeft}px)`;
  if (squish) { ind.classList.remove("squish"); void ind.offsetWidth; ind.classList.add("squish"); }
}
function go(name) {
  if (name === current) return;
  const dir = name === "apply" ? "from-below" : ORDER.indexOf(name) > ORDER.indexOf(current) ? "from-right" : "from-left";
  current = name;
  document.querySelectorAll(".view").forEach(v => {
    const on = v.id === "v-" + name;
    v.classList.remove("from-right", "from-left", "from-below", "fade");
    v.classList.toggle("on", on);
    if (on) { void v.offsetWidth; v.classList.add(dir); armReveal(v); }
  });
  const tab = document.querySelector(`.tab[data-go="${name}"]`);
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === tab));
  tabInd.style.opacity = tab ? 1 : 0;
  moveIndicator(tabInd, tab, true);
  document.querySelector(".fab").classList.toggle("hidden", name === "apply");
  window.scrollTo({ top: 0 });
  haptic();
  if (name === "program") requestAnimationFrame(() => moveIndicator(document.getElementById("seg-ind"), document.querySelector("#seg .on")));
  if (name === "trip") setTimeout(initMap, 60);
  if (tg && tg.BackButton) name === "home" ? tg.BackButton.hide() : tg.BackButton.show();
}
if (tg && tg.BackButton) tg.BackButton.onClick(() => go("home"));

function openLink(url) {
  if (tg && url.startsWith("https://t.me/") && tg.openTelegramLink) tg.openTelegramLink(url);
  else if (tg && tg.openLink && url.startsWith("http")) tg.openLink(url);
  else window.open(url, "_blank");
}

// ================= КАРТА =================
let map = null, markers = {};
function initMap() {
  if (map || !window.L || !document.getElementById("map")) { if (!window.L) setTimeout(initMap, 200); return; }
  const dark = document.documentElement.dataset.theme === "dark";
  map = window.L.map("map", { zoomControl: false, attributionControl: true, scrollWheelZoom: false });
  window.L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom: 18, attribution: '© OpenStreetMap', className: dark ? "tiles-dark" : "tiles-light" }).addTo(map);
  PLACES.forEach(p => {
    const icon = window.L.divIcon({ className: "", html: `<div class="pin"><span>${p.e}</span></div>`, iconSize: [34, 34], iconAnchor: [17, 34], popupAnchor: [0, -32] });
    markers[p.id] = window.L.marker(p.ll, { icon }).addTo(map).bindPopup(`<b>${esc(L.places[p.id][0])}</b><br>${esc(L.places[p.id][1])}`);
  });
  map.fitBounds(PLACES.map(p => p.ll), { padding: [36, 36] });
}
function focusPlace(id) {
  const p = PLACES.find(x => x.id === id);
  if (!map || !p) return;
  document.querySelectorAll(".place").forEach(r => r.classList.toggle("active", r.dataset.place === id));
  map.flyTo(p.ll, 12, { duration: 1.1 });
  setTimeout(() => {
    markers[id].openPopup();
    const pin = markers[id].getElement().querySelector(".pin");
    pin.classList.remove("on"); void pin.offsetWidth; pin.classList.add("on");
  }, 1100);
  document.querySelector(".map-wrap").scrollIntoView({ behavior: "smooth", block: "center" });
}

// ================= ПРОСМОТР ФОТО =================
const lb = document.getElementById("lightbox"), lbImg = lb.querySelector("img");
let lbFrom = null;
function flip(a, b) { return `translate(${a.left + a.width / 2 - (b.left + b.width / 2)}px, ${a.top + a.height / 2 - (b.top + b.height / 2)}px) scale(${a.width / b.width}, ${a.height / b.height})`; }
function openLb(img) {
  lbFrom = img; lbImg.src = img.src; lb.classList.add("on"); haptic();
  const run = () => lbImg.animate([{ transform: flip(img.getBoundingClientRect(), lbImg.getBoundingClientRect()), opacity: .6 }, { transform: "none", opacity: 1 }], { duration: 520, easing: "cubic-bezier(.22,1,.36,1)" });
  lbImg.complete ? requestAnimationFrame(run) : (lbImg.onload = run);
}
function closeLb() {
  if (!lb.classList.contains("on")) return;
  lbImg.animate([{ transform: "none" }, { transform: flip(lbFrom.getBoundingClientRect(), lbImg.getBoundingClientRect()), opacity: .4 }], { duration: 380, easing: "cubic-bezier(.22,1,.36,1)" });
  lb.classList.remove("on");
}
lb.addEventListener("click", closeLb);

// ================= ОБРАБОТКА НАЖАТИЙ =================
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-go],[data-lang],[data-zoom],[data-ask],[data-open],[data-place],[data-seg],.qa-q,[data-link]");
  if (!el) return;
  if (el.dataset.go) return go(el.dataset.go);
  if (el.dataset.lang) {
    if (el.dataset.lang === lang) return;
    lang = el.dataset.lang;
    try { localStorage.setItem("lang", lang); } catch (e) {}
    haptic();
    document.querySelector(".lang").dataset.l = lang;   // анимация переключателя
    setTimeout(() => { renderAll(); const v = document.querySelector(".view.on"); v.classList.add("fade"); }, 260);
    return;
  }
  if (el.hasAttribute("data-zoom")) return openLb(el.querySelector("img"));
  if (el.hasAttribute("data-ask")) return openLink(CONFIG.managerTg);
  if (el.dataset.open) return openLink(el.dataset.open);
  if (el.hasAttribute("data-link") && el.href.startsWith("http")) { ev.preventDefault(); return openLink(el.href); }
  if (el.dataset.place) return focusPlace(el.dataset.place);
  if (el.dataset.seg) {
    document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === el));
    moveIndicator(document.getElementById("seg-ind"), el);
    let i = 0;
    document.querySelectorAll("#days .daycard").forEach(d => {
      const show = el.dataset.seg === "all" || d.dataset.k === el.dataset.seg;
      d.classList.toggle("hide", !show); d.classList.remove("pop");
      if (show) { void d.offsetWidth; d.style.animationDelay = (i++ * 50) + "ms"; d.classList.add("pop"); }
    });
    return haptic();
  }
  if (el.classList.contains("qa-q")) {
    const qa = el.parentElement, open = !qa.classList.contains("open");
    document.querySelectorAll(".qa.open").forEach(x => x.classList.remove("open"));
    qa.classList.toggle("open", open);
    return haptic();
  }
});

// ================= ЗАЯВКА =================
document.addEventListener("submit", ev => {
  if (ev.target.id !== "form") return;
  ev.preventDefault();
  const f = ev.target, err = document.getElementById("err");
  const data = { name: f.name.value.trim(), specialty: f.specialty.value, phone: f.phone.value.trim() };
  const fail = i => {
    err.textContent = L.errs[i];
    const g = f.querySelector(".group"); g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake");
    try { tg.HapticFeedback.notificationOccurred("error"); } catch (e) {}
  };
  if (!data.name) return fail(0);
  if (!data.specialty) return fail(1);
  if (data.phone.replace(/\D/g, "").length < 10) return fail(2);
  if (!f.agree.checked) return fail(3);
  err.textContent = "";
  try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
  f.style.display = "none";
  document.getElementById("done").classList.add("on");
  if (tg && tg.platform && tg.platform !== "unknown") setTimeout(() => tg.sendData(JSON.stringify(data)), 1500);  // приложение закроется, бот получит заявку
});

// ================= ТЕМА И ЗАПУСК =================
function applyTheme() {
  const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  try { const c = dark ? "#0c0709" : "#f4f0f0"; tg.setHeaderColor(c); tg.setBackgroundColor(c); tg.setBottomBarColor && tg.setBottomBarColor(c); } catch (e) {}
}
applyTheme();
if (tg) {
  tg.ready(); tg.expand();
  tg.onEvent("themeChanged", () => { applyTheme(); if (map) { map.remove(); map = null; if (current === "trip") initMap(); } });
}

addEventListener("scroll", () => {
  const bg = document.getElementById("hero-bg");
  if (current === "home" && bg) bg.style.translate = `0 ${Math.min(scrollY, 600) * 0.25}px`;
}, { passive: true });
addEventListener("resize", () => { moveIndicator(tabInd, document.querySelector(".tab.on")); moveIndicator(document.getElementById("seg-ind"), document.querySelector("#seg .on")); });
addEventListener("load", () => moveIndicator(tabInd, document.querySelector(".tab.on")));

renderAll();
</script>
</body>
</html>
